<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrainBrain</title>
  <!-- Установка «На экран Домой» -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrainBrain">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#22272e">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Экран «Колода»: список карточек и добавление -->
  <main id="deck-screen" class="app screen" hidden>
    <button id="back-btn" class="big-button secondary back-btn" type="button">← Назад</button>
    <h2 id="deck-title" class="deck-title"></h2>
    <p id="deck-card-count" class="deck-card-count"></p>

    <div id="card-list"></div>
    <p id="cards-empty" class="empty-text" hidden>В этой колоде пока нет карточек</p>

    <button id="new-card-btn" class="big-button" type="button">Новая карточка</button>

    <div id="new-card-form" class="new-deck-form" hidden>
      <textarea id="card-question" rows="3" placeholder="Вопрос" aria-label="Вопрос"></textarea>
      <textarea id="card-answer" rows="3" placeholder="Ответ" aria-label="Ответ"></textarea>
      <p id="card-hint" class="form-hint" role="status"></p>
      <button id="card-add-btn" class="big-button" type="button">Добавить</button>
      <button id="card-done-btn" class="big-button secondary" type="button">Готово</button>
    </div>
  </main>

  <main id="decks-screen" class="app screen">
    <h1>TrainBrain</h1>
    <h2>Колоды</h2>

    <div id="deck-list"></div>
    <p id="empty-text" class="empty-text" hidden>Пока нет колод</p>

    <button id="new-deck-btn" class="big-button" type="button">Новая колода</button>

    <div id="new-deck-form" class="new-deck-form" hidden>
      <input id="deck-name-input" type="text" maxlength="60"
             placeholder="Название колоды" autocomplete="off">
      <p id="form-hint" class="form-hint"></p>
      <button id="create-btn" class="big-button" type="button">Создать</button>
      <button id="cancel-btn" class="big-button secondary" type="button">Отмена</button>
    </div>

    <p id="app-version" class="app-version"></p>
  </main>

  <!-- Обычные скрипты (не module). version.js и storage.js идут перед app.js -->
  <script src="js/version.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
