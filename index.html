<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrainBrain</title>
  <!-- Установка «На экран Домой» -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TrainBrain">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2f6fed">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>TrainBrain</h1>
    <h2>Колоды</h2>

    <div id="deck-list"></div>
    <p id="empty-text" class="empty-text" hidden>Пока нет колод</p>

    <button id="new-deck-btn" class="big-button" type="button">Новая колода</button>

    <div id="new-deck-form" class="new-deck-form" hidden>
      <input id="deck-name-input" type="text" maxlength="60"
             placeholder="Название колоды" autocomplete="off">
      <p id="form-hint" class="form-hint"></p>
      <button id="create-btn" class="big-button" type="button">Создать</button>
      <button id="cancel-btn" class="big-button secondary" type="button">Отмена</button>
    </div>
  </main>

  <!-- Обычные скрипты (не module). storage.js должен идти перед app.js -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
